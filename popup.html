<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Viking Power Search</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <h3>Viking Power Search</h3>

        <div class="form-group row profile-bar">
            <div style="flex: 1.2;">
                <label for="profileSelect">Saved Cruise</label>
                <select id="profileSelect">
                    <option value="">-- New --</option>
                </select>
            </div>
            <div style="flex: 2;">
                <label for="profileName">Save As</label>
                <input type="text" id="profileName" placeholder="e.g. Iceland &amp; Greenland">
            </div>
        </div>

        <div class="form-group">
                <div class="label-row">
                    <label for="cruiseUrl">Cruise URL</label>
                    <button type="button" id="useTabBtn" class="mini-btn" title="Use URL from the active tab">Use
                        Current Tab</button>
                </div>
                <input type="text" id="cruiseUrl" placeholder="Paste Viking Cruises AU pricing URL...">
                <div class="help-text">Paste any vikingcruises.com.au itinerary or pricing URL (checks PS3 fares).</div>
            </div>

            <div class="btn-row">
                <button type="button" id="saveBtn">Save</button>
                <button type="button" id="deleteBtn" disabled>Delete</button>
                <button type="button" id="searchBtn">Search</button>
            </div>

            <div id="resultCard" class="result-card hidden"></div>

            <script src="viking-parser.js"></script>
            <script src="popup.js"></script>
</body>

</html>
